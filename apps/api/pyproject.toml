[project]
name = "business-os-api"
version = "0.1.0"
description = "Business OS backend API"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.11.0",
    "email-validator>=2.3.0",
    "fastapi>=0.142.2",
    "jinja2>=3.1.6",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.1",
    "python-multipart>=0.0.32",
    "redis>=5.0.0",
    "sentry-sdk>=2.0",
    "sqlalchemy>=2.1.3",
    "uvicorn[standard]>=0.54.0",
    "weasyprint>=70.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF", "S"]
ignore = [
    # Hebrew letters are legitimate content (vertical packs, demo data), not look-alike characters.
    "RUF001",
    # assert is used for type narrowing in app code and is the pytest idiom in tests.
    "S101",
    # Only identifiers and clauses written in code reach these f-strings; values are always bound
    # parameters. tests/test_sql_fstrings.py fails on any new f-string inside text(...).
    "S608",
]

[tool.ruff.lint.per-file-ignores]
# Inline-styled email HTML reads better unwrapped.
"app/catalog/welcome.py" = ["E501"]
# Demo data, samples and load tests need reproducible pseudo-random numbers, not secrets.
"app/seed/*" = ["S311"]
"app/social/demo.py" = ["S311"]
"app/api/samples.py" = ["S311"]
"scripts/*" = ["S311"]
# Test fixtures use fake tokens and secrets, seeded random data and local subprocesses.
"tests/*" = ["S105", "S106", "S311", "S603"]
# Names of constants (a header name, a URL, a lookup column), not secret values.
"migrations/versions/0050_documents_time.py" = ["S105"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
