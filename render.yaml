# Render Blueprint: the API's staging service. Render reads this file when you create a
# Blueprint from the repository. Secrets are marked `sync: false`; Render asks for them once.
services:
  - type: web
    name: business-os-api-staging
    runtime: docker
    rootDir: apps/api
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: frankfurt
    plan: free
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: API_ENVIRONMENT
        value: staging
      # Render's proxy appends the caller's address last in X-Forwarded-For (rate limits).
      - key: API_TRUST_FORWARDED_FOR
        value: "true"
      # Shared with the web app (same name there) so it can name the real visitor.
      - key: API_INTERNAL_TOKEN
        sync: false
      - key: API_DATABASE_URL
        sync: false
      - key: API_JWKS_URL
        sync: false
      # Optional: enables the AI assistant (Anthropic Console API key). Without it the
      # assistant screen says it isn't set up yet.
      - key: API_ANTHROPIC_API_KEY
        sync: false

# Production background jobs are in render.production.yaml (a second Blueprint), kept OFF until
# production is approved: see docs/deploy/go-live-checklist.md.
