name: Hourly jobs on staging

# Jobs that must run close to a business's chosen time of day (see apps/api/app/jobs.py).
# Scheduled runs use the default branch.
on:
  schedule:
    - cron: "11 * * * *"
  workflow_dispatch:

concurrency:
  group: migrate-staging
  cancel-in-progress: false

jobs:
  publish-shifts:
    name: Publish shift rosters that are due
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        working-directory: apps/api
        run: uv sync --locked --no-dev

      - name: Publish
        working-directory: apps/api
        env:
          API_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: uv run python -m app.jobs publish-shifts
