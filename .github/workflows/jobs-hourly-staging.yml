name: Hourly jobs on staging

# Jobs that must run close to a business's chosen time of day (see apps/api/app/jobs/).
# Scheduled runs use the default branch.
on:
  schedule:
    - cron: "11 * * * *"
  workflow_dispatch:

concurrency:
  group: migrate-staging
  cancel-in-progress: false

jobs:
  publish-shifts:
    name: Publish shift rosters that are due
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        working-directory: apps/api
        run: uv sync --locked --no-dev

      - name: Publish
        working-directory: apps/api
        env:
          API_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          API_ENVIRONMENT: staging
        run: uv run python -m app.jobs publish-shifts

  send-announcements:
    name: Send the broadcast center's messages that are due
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        working-directory: apps/api
        run: uv sync --locked --no-dev

      # Pop-ups and push need no email provider; email goes out when EMAIL_PROVIDER is set
      # (otherwise those deliveries are marked "skipped").
      - name: Send
        working-directory: apps/api
        env:
          API_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          API_ENVIRONMENT: staging
          API_EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER }}
          API_EMAIL_API_KEY: ${{ secrets.EMAIL_API_KEY }}
          API_EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          # The opt-out link in a marketing email is signed with the API's key and opens on the API.
          API_SECRETS_KEY: ${{ secrets.STAGING_SECRETS_KEY }}
          API_API_URL: ${{ vars.API_PUBLIC_URL || 'https://business-os-api-staging.onrender.com' }}
        run: uv run python -m app.jobs send-announcements
