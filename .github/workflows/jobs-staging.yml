name: Background jobs on staging

# Daily system jobs (see apps/api/app/jobs.py). Scheduled runs use the default branch.
on:
  schedule:
    - cron: "17 2 * * *"  # 02:17 UTC, early morning in Israel
  workflow_dispatch:

concurrency:
  group: migrate-staging
  cancel-in-progress: false

jobs:
  extend-series:
    name: Extend weekly series, remind today's classes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        working-directory: apps/api
        run: uv sync --locked --no-dev

      - name: Run
        working-directory: apps/api
        env:
          API_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          API_ENVIRONMENT: staging
        run: uv run python -m app.jobs extend-series

      - name: Remind today's booked clients
        working-directory: apps/api
        env:
          API_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          API_ENVIRONMENT: staging
        run: uv run python -m app.jobs remind-sessions

      - name: Remind clients whose plan ends soon
        working-directory: apps/api
        env:
          API_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          API_ENVIRONMENT: staging
        run: uv run python -m app.jobs remind-plans

      - name: Remind owners to approve last month's payroll (1st and 5th of the month)
        working-directory: apps/api
        env:
          API_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          API_ENVIRONMENT: staging
        run: uv run python -m app.jobs remind-payroll

      - name: Invoice businesses for MyBiz (simulated charges)
        working-directory: apps/api
        env:
          API_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          API_ENVIRONMENT: staging
        run: uv run python -m app.jobs bill-businesses

      - name: Remind businesses with unpaid MyBiz invoices; read-only and suspension (simulated)
        working-directory: apps/api
        env:
          API_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          API_ENVIRONMENT: staging
        run: uv run python -m app.jobs dunning

      - name: Copy today's reminders to WhatsApp (simulated, messaging module)
        working-directory: apps/api
        env:
          API_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          API_ENVIRONMENT: staging
        run: uv run python -m app.jobs message-reminders

      - name: Follow up leads nobody has touched (leads on autopilot)
        working-directory: apps/api
        env:
          API_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          API_ENVIRONMENT: staging
        run: uv run python -m app.jobs follow-up-leads

      - name: Delete data past its retention period (decision X20)
        working-directory: apps/api
        env:
          API_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          API_ENVIRONMENT: staging
        run: uv run python -m app.jobs purge-expired

      - name: Report businesses closed more than 90 days ago (dry run; add --apply to delete, X20)
        working-directory: apps/api
        env:
          API_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          API_ENVIRONMENT: staging
        run: uv run python -m app.jobs delete-closed-businesses

      - name: Send queued messages through each business's provider
        working-directory: apps/api
        env:
          API_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          API_ENVIRONMENT: staging
          API_SECRETS_KEY: ${{ secrets.STAGING_SECRETS_KEY }}
        run: uv run python -m app.jobs send-messages

      - name: Issue receipts' documents with each business's invoicing provider
        working-directory: apps/api
        env:
          API_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          API_ENVIRONMENT: staging
          API_SECRETS_KEY: ${{ secrets.STAGING_SECRETS_KEY }}
        run: uv run python -m app.jobs issue-documents

      - name: Read the latest numbers of connected social accounts (content studio)
        working-directory: apps/api
        env:
          API_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          API_ENVIRONMENT: staging
          API_SECRETS_KEY: ${{ secrets.STAGING_SECRETS_KEY }}
        run: uv run python -m app.jobs sync-social
