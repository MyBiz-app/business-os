name: Deploy the Expo app to the web (Vercel)

# Builds the Expo app as a static web app on the runner and uploads the finished files
# to Vercel (project mybiz-client-app). The retired business and staff web addresses only redirect to it. Started by hand from the
# Actions tab, so nothing is published until the owner asks for it.
on:
  workflow_dispatch:
    inputs:
      app:
        description: "Which app"
        type: choice
        default: all
        options: [all, client-app, legacy-redirects]

env:
  # Not a secret: names the Vercel team. Passed as --scope (VERCEL_ORG_ID alone is rejected by the CLI).
  VERCEL_SCOPE: team_KwKjSLwpf7CxSCUP92Fbx6qK
  VERCEL_CLI: vercel@59.26.0
  # Public values only (the same ones the website ships to every browser).
  EXPO_PUBLIC_API_URL: https://business-os-api-staging.onrender.com
  EXPO_PUBLIC_SUPABASE_URL: https://mywfwzdrlbpxeheszasd.supabase.co
  EXPO_PUBLIC_SUPABASE_KEY: sb_publishable_a9rwxNcFQSpDxyxhu1wApA_a_LHcu5A

jobs:
  deploy:
    name: Deploy ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    strategy:
      fail-fast: false
      matrix:
        app: [client-app]
    steps:
      - name: Skip apps that were not asked for
        id: pick
        run: |
          if [ "${{ inputs.app }}" = "all" ] || [ "${{ inputs.app }}" = "${{ matrix.app }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.pick.outputs.run == 'true'

      - uses: pnpm/action-setup@v6
        if: steps.pick.outputs.run == 'true'

      - uses: actions/setup-node@v7
        if: steps.pick.outputs.run == 'true'
        with:
          node-version: 24
          cache: pnpm

      - name: Install and export the web build
        if: steps.pick.outputs.run == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter ${{ matrix.app }} exec expo export -p web --output-dir dist
          # Single-page app: every path serves index.html.
          cp apps/${{ matrix.app }}/vercel.json apps/${{ matrix.app }}/dist/vercel.json
          sed -i '/buildCommand/d;/outputDirectory/d' apps/${{ matrix.app }}/dist/vercel.json

      - name: Upload to Vercel
        if: steps.pick.outputs.run == 'true'
        working-directory: apps/${{ matrix.app }}/dist
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -o pipefail
          test -n "$VERCEL_TOKEN" || { echo "::error::VERCEL_TOKEN is not set"; exit 1; }
          npx --yes "$VERCEL_CLI" deploy --prod --yes --name "mybiz-${{ matrix.app }}" --scope "$VERCEL_SCOPE" --token="$VERCEL_TOKEN" | tee url.txt
          echo "### ${{ matrix.app }}: $(tail -n1 url.txt)" >> "$GITHUB_STEP_SUMMARY"

  # The business and MyBiz team apps are part of the one app now. Their old Vercel projects stay
  # (nothing is deleted) but only redirect to it.
  legacy-redirects:
    name: Redirect ${{ matrix.project }}
    if: inputs.app == 'all' || inputs.app == 'legacy-redirects'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    strategy:
      fail-fast: false
      matrix:
        project: [mybiz-business-app, mybiz-staff-app]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Upload the redirect to Vercel
        working-directory: infra/legacy-redirects
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -o pipefail
          test -n "$VERCEL_TOKEN" || { echo "::error::VERCEL_TOKEN is not set"; exit 1; }
          npx --yes "$VERCEL_CLI" deploy --prod --yes --name "${{ matrix.project }}" --scope "$VERCEL_SCOPE" --token="$VERCEL_TOKEN" | tee url.txt
          echo "### ${{ matrix.project }}: $(tail -n1 url.txt)" >> "$GITHUB_STEP_SUMMARY"
