name: Migrate staging database

# Applies Alembic migrations to the staging database. Runs on every push to main that changes
# migrations, and can be started by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths: ["apps/api/migrations/**"]
  workflow_dispatch:

concurrency:
  group: migrate-staging
  cancel-in-progress: false

jobs:
  migrate:
    name: alembic upgrade head
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        working-directory: apps/api
        run: uv sync --locked --no-dev

      - name: Apply migrations
        working-directory: apps/api
        env:
          API_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          if [ -z "$API_DATABASE_URL" ]; then
            echo "::error::Secret STAGING_DATABASE_URL is not set (Settings > Environments > staging)."
            exit 1
          fi
          uv run alembic upgrade head
