name: Grant platform admin on staging

# Adds an owner to MyBiz's team on staging (sees the whole console). After that, owners
# manage the team from the console itself. Started by hand from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      email:
        description: Email of the person (they can sign up before or after)
        required: true
        type: string

jobs:
  grant:
    name: Grant platform admin
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    steps:
      - name: Install the PostgreSQL client
        run: sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Grant
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          EMAIL: ${{ inputs.email }}
        run: |
          granted=$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -v email="$EMAIL" -tA <<'SQL'
          INSERT INTO app.platform_staff (email, level, added_by)
          VALUES (lower(:'email'), 'owner', 'staging workflow')
          ON CONFLICT DO NOTHING
          RETURNING email;
          SQL
          )
          if [ -z "$granted" ]; then
            echo "::warning::No change: this email is already on the team."
          fi
