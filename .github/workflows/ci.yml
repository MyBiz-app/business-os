name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # The official image through Google's Docker Hub mirror: Docker Hub and the AWS mirror rate-limit shared runners.
        image: mirror.gcr.io/library/postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        working-directory: apps/api
        run: uv sync --locked

      - name: Check the generated API client is up to date
        run: |
          pnpm api:generate
          git diff --exit-code -- packages/api-client || {
            echo "::error::packages/api-client is out of date. Run 'pnpm api:generate' and commit."
            exit 1
          }

      - name: Run checks
        run: pnpm turbo run lint typecheck test build

  expo-web-export:
    name: Bundle ${{ matrix.app }} (Expo web)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [client-app]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      # Catches what typecheck cannot: a missing native module, a bad import, a broken app.json.
      - name: Export the web bundle
        run: pnpm --filter ${{ matrix.app }} exec expo export -p web --output-dir "$RUNNER_TEMP/dist"

  load-test:
    name: Load test (10x demo data)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python dependencies
        working-directory: apps/api
        run: uv sync --locked

      # The busiest business journeys on a demo ten times its usual size. The budget is loose:
      # it catches a missing index or a query per client, not a slow runner.
      - name: Run the load test
        working-directory: apps/api
        env:
          LOAD_TEST: "1"
          LOAD_REPORT: ${{ runner.temp }}/load-report.md
        run: |
          uv run pytest tests/load -s -p no:logging
          cat "$LOAD_REPORT" >> "$GITHUB_STEP_SUMMARY"
