name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# FAST MODE (2026-10-19, until the functional build is finished; see docs/DECISIONS.md):
# a pull request runs only the fast core: lint, typecheck, build, the JavaScript tests and a
# short list of API guard tests (tenant isolation, security, migrations, routes).
# The heavy layers (the whole API suite in 4 shards, security scans, load test) run after every
# merge to main, nightly, and on demand. To switch them back on for pull requests too, set the
# repository variable CI_FULL to true (Settings > Secrets and variables > Actions > Variables).
jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        # The official image through Google's Docker Hub mirror: Docker Hub and the AWS mirror rate-limit shared runners.
        image: mirror.gcr.io/library/postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install PDF system libraries
        run: sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0

      - name: Install Python dependencies
        working-directory: apps/api
        run: uv sync --locked

      - name: Check no em or en dashes are used
        run: node scripts/check-no-long-dash.cjs

      - name: Check Markdown links in docs
        run: node scripts/check-doc-links.cjs

      - name: Check the generated API client is up to date
        run: |
          pnpm api:generate
          git diff --exit-code -- packages/api-client || {
            echo "::error::packages/api-client is out of date. Run 'pnpm api:generate' and commit."
            exit 1
          }

      - name: Run checks
        run: |
          pnpm turbo run lint typecheck build
          pnpm turbo run test --filter='!api'

      # Fast mode only: the guard tests of the API. The whole suite runs in the shards below.
      - name: API guard tests
        if: github.event_name == 'pull_request' && vars.CI_FULL != 'true'
        working-directory: apps/api
        run: >-
          uv run pytest -p no:logging
          tests/test_tenant_isolation.py tests/test_tenant_matrix.py tests/test_database_security.py
          tests/test_critical_paths.py tests/test_pagination.py tests/test_router_registry.py
          tests/test_migration_chain.py tests/test_migration_contract.py tests/test_migrations.py
          tests/test_model_layer.py tests/test_config.py tests/test_production_guards.py
          tests/test_sql_fstrings.py tests/test_sql_identifiers.py tests/test_permissions.py
          tests/test_roles.py tests/test_modules.py tests/test_provider_contracts.py
          tests/test_ai_structure.py tests/test_privacy.py tests/test_health.py

  # The whole API suite split in 4 parallel jobs (each with its own database). Skipped on pull
  # requests in fast mode.
  api-tests:
    name: API tests (shard ${{ matrix.shard }} of 4)
    if: github.event_name != 'pull_request' || vars.CI_FULL == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install PDF system libraries
        run: sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0

      - name: Install Python dependencies
        working-directory: apps/api
        run: uv sync --locked

      - name: Run this shard of the tests
        working-directory: apps/api
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          files=$(ls tests/test_*.py | sort | awk -v k="$SHARD" 'NR % 4 == k')
          uv run pytest -p no:logging $files

  # Runs in parallel with the main job, so it does not add to its 25 minute budget.
  # CodeQL is not used: on a private repository it needs GitHub Advanced Security (paid).
  # Bandit style code analysis is ruff's S rules, which run in the main job's lint step.
  security:
    name: Security scans
    if: github.event_name != 'pull_request' || vars.CI_FULL == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Scan the git history for secrets (gitleaks)
        env:
          GITLEAKS_VERSION: 8.28.0
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner

      - name: Audit Python dependencies (pip-audit)
        working-directory: apps/api
        run: |
          uv export --locked --no-dev --no-hashes --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip

      - name: Audit JavaScript dependencies (pnpm audit)
        run: node scripts/check-pnpm-audit.cjs

      - name: Build the API image
        run: docker build -t business-os-api:scan apps/api

      # Warns only for now (the plan: block after a clean week); the nightly run reports it as an issue.
      - name: Scan the API image (Trivy)
        continue-on-error: true
        env:
          TRIVY_VERSION: 0.69.3
        run: |
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" | tar xz trivy
          ./trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 business-os-api:scan

  expo-web-export:
    name: Bundle ${{ matrix.app }} (Expo web)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [client-app]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      # Catches what typecheck cannot: a missing native module, a bad import, a broken app.json.
      - name: Export the web bundle
        run: pnpm --filter ${{ matrix.app }} exec expo export -p web --output-dir "$RUNNER_TEMP/dist"

  load-test:
    name: Load test (10x demo data)
    if: github.event_name != 'pull_request' || vars.CI_FULL == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install PDF system libraries
        run: sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0

      - name: Install Python dependencies
        working-directory: apps/api
        run: uv sync --locked

      # The busiest business journeys on a demo ten times its usual size. The budget is loose:
      # it catches a missing index or a query per client, not a slow runner.
      - name: Run the load test
        working-directory: apps/api
        env:
          LOAD_TEST: "1"
          LOAD_REPORT: ${{ runner.temp }}/load-report.md
        run: |
          uv run pytest tests/load -s -p no:logging
          cat "$LOAD_REPORT" >> "$GITHUB_STEP_SUMMARY"
