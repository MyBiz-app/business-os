name: Uptime check and keep the staging API awake

# Render's free plan puts the API to sleep after 15 minutes without traffic; the first request
# then waits up to a minute and the web app shows an error. A request every 10 minutes, around the
# clock (a daytime-only schedule left the API asleep at night), keeps it awake and doubles as the uptime check: the job fails (and GitHub
# emails the repository's watchers) when /health/ready does not answer {"status":"ok"} after
# three tries, or when the web app is down. The free plan's 750 hours a month cover one service
# running all month. Remove the keep-awake part when the API moves to a paid plan, which never
# sleeps; keep the check (or use an outside monitor, see docs/monitoring.md).
#
# Optional repository variables (Settings → Secrets and variables → Actions → Variables) point
# the check at production: UPTIME_API_URL and UPTIME_WEB_URL.
on:
  schedule:
    - cron: "*/10 * * * *"  # every 10 minutes, around the clock
  workflow_dispatch:

concurrency:
  group: keep-api-awake
  cancel-in-progress: true

jobs:
  check:
    name: Check /health/ready and the web app
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      API_URL: ${{ vars.UPTIME_API_URL || 'https://business-os-api-staging.onrender.com' }}
      WEB_URL: ${{ vars.UPTIME_WEB_URL || 'https://business-os-alpha-drab.vercel.app' }}
    steps:
      - name: API is ready
        run: |
          # The first try may wake a sleeping free-plan API, so allow time and retry.
          body=$(curl --silent --show-error --fail --max-time 120 --retry 2 --retry-delay 20 \
            --retry-all-errors "$API_URL/health/ready")
          echo "$body"
          echo "$body" | grep -q '"status":"ok"'

      - name: Web app answers
        run: curl --silent --show-error --fail --max-time 60 --retry 2 --retry-delay 10 --output /dev/null "$WEB_URL/"

      # Runs the AI agents' scheduled tasks that are due. The API answers at once and does the
      # work in the background, so the time of a task is accurate to about these 10 minutes (and
      # GitHub sometimes starts a run late). Needs the repository secret API_INTERNAL_TOKEN, the
      # same value as the API's API_INTERNAL_TOKEN; without it this step does nothing. A worker
      # that calls this every minute (a paid Render plan) makes the timing exact.
      - name: Run due scheduled AI tasks
        env:
          INTERNAL_TOKEN: ${{ secrets.API_INTERNAL_TOKEN }}
        run: |
          if [ -z "$INTERNAL_TOKEN" ]; then
            echo "API_INTERNAL_TOKEN is not set: scheduled AI tasks are not triggered from here."
            exit 0
          fi
          curl --silent --show-error --max-time 60 --retry 2 --retry-delay 10 -X POST \
            -H "X-Internal-Token: $INTERNAL_TOKEN" "$API_URL/internal/jobs/tick" \
            || echo "::warning::Could not trigger the scheduled AI tasks"
