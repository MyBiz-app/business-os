name: Demo logo sample (temporary)

# One-off: asks the image API (Runware, approved by the owner) for sample logos and prints
# their URLs in the log. Runs only when this file changes in a pull request; remove before merge.
on:
  pull_request:
    paths:
      - .github/workflows/demo-logo-sample.yml

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    steps:
      - name: Generate sample logos
        env:
          RUNWARE_KEY: ${{ secrets.REPLICATE_API_TOKEN }}
        run: |
          set -euo pipefail
          prompt="Professional brand logo mark for a strength training gym called Adir Fitness, bold minimalist emblem combining a barbell and the letter A, strictly black and white, high contrast, premium sports brand identity, centered on a plain white background, flat vector style, no gradients, no text"
          body=$(jq -n --arg p "$prompt" --arg id "$(cat /proc/sys/kernel/random/uuid)" \
            '[{taskType:"imageInference",taskUUID:$id,positivePrompt:$p,model:"runware:100@1",width:1024,height:1024,steps:4,numberResults:2,outputType:"URL",outputFormat:"PNG"}]')
          curl -sS https://api.runware.ai/v1 -H "Authorization: Bearer $RUNWARE_KEY" \
            -H "Content-Type: application/json" -d "$body" | jq -r '.data[]?.imageURL, .errors[]?.message'
