name: Demo logo sample (temporary)

# One-off: asks the image API (Runware, approved by the owner) for the demo logos and two sample
# portraits and prints their URLs in the log. Runs only when this file changes in a pull
# request; remove before merge.
on:
  pull_request:
    paths:
      - .github/workflows/demo-logo-sample.yml

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - name: Generate logos and portraits
        env:
          RUNWARE_KEY: ${{ secrets.REPLICATE_API_TOKEN }}
        run: |
          set -euo pipefail
          gen() { # label, prompt, count
            body=$(jq -n --arg p "$2" --arg id "$(cat /proc/sys/kernel/random/uuid)" --argjson n "$3" \
              '[{taskType:"imageInference",taskUUID:$id,positivePrompt:$p,model:"runware:100@1",width:1024,height:1024,steps:4,numberResults:$n,outputType:"URL",outputFormat:"PNG"}]')
            curl -sS https://api.runware.ai/v1 -H "Authorization: Bearer $RUNWARE_KEY" \
              -H "Content-Type: application/json" -d "$body" | jq -r --arg l "$1" '.data[]?.imageURL | "RESULT \($l) \(.)"'
          }
          gen fitness-dark "Professional square brand logo for a strength training gym called ADIR FITNESS, bold minimalist emblem of a barbell with plates combined with the letter A, solid black background, emblem and the text ADIR FITNESS in pure white, high contrast, premium sports brand identity, centered, flat vector style" 2
          gen tennis "Elegant square brand logo for a tennis club called SHARON TENNIS CLUB, emblem of a tennis ball and a racket, deep green and white palette inspired by grass courts and Roland Garros, soft pale green background, clean premium sports club identity, centered, flat vector style, the text SHARON TENNIS CLUB" 2
          gen barbers "Stylish vintage square brand logo for a men's barbershop called BLADE BARBERS, emblem of crossed scissors and a straight razor, black and gold on a soft warm cream background, premium craft barbershop identity, centered, flat vector style, the text BLADE BARBERS" 2
          gen clinic "Calm modern square brand logo for a physiotherapy and nutrition clinic called MERHAV CLINIC, emblem of a human figure in motion inside a leaf shape, teal and white palette on a soft mint background, trustworthy healthcare identity, centered, flat vector style, the text MERHAV CLINIC and the small text HEALTH AND MOVEMENT" 2
          gen yoga "Calming square brand logo for a yoga and pilates studio called ADIR YOGA, emblem of a lotus flower, sage green, white and warm natural brown palette on a soft cream background, nature and wellness identity, centered, flat vector style, the text ADIR YOGA" 2
          gen portrait-woman "Natural professional headshot photo of a friendly Israeli woman in her early thirties, a fitness coach, smiling, dark hair tied back, wearing a black athletic top, soft studio lighting, plain neutral background, realistic photograph" 1
          gen portrait-man "Natural professional headshot photo of a friendly Israeli man in his thirties, a barber, short dark hair and neat trimmed beard, smiling, wearing a black shirt, soft studio lighting, plain neutral background, realistic photograph" 1
