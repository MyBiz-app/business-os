name: Restore drill (latest R2 backup into a scratch database)

# GL15. Proves the second backup can be read back: downloads the newest dump from R2, decrypts it,
# restores it into a throwaway Postgres and runs smoke checks. Manual, and quarterly via the
# reminder issue. Needs the age PRIVATE key as the secret BACKUP_AGE_IDENTITY: add it only for the
# drill and delete it afterwards (the private key otherwise lives only with the owner).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drill:
    name: Restore the latest backup
    if: vars.OFFSITE_BACKUP_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: backup
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17
        env:
          POSTGRES_PASSWORD: drill
          POSTGRES_DB: scratch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install pg_restore 17 and age
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common age
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Restore and check
        env:
          BACKUP_AGE_IDENTITY: ${{ secrets.BACKUP_AGE_IDENTITY }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TARGET_DATABASE_URL: postgresql://postgres:drill@localhost:5432/scratch
        run: |
          umask 077
          printf '%s\n' "$BACKUP_AGE_IDENTITY" > "$RUNNER_TEMP/age-identity.txt"
          export AGE_IDENTITY_FILE="$RUNNER_TEMP/age-identity.txt"
          scripts/backup/restore-drill.sh | tee drill.txt
          rm -f "$AGE_IDENTITY_FILE"
          {
            echo "### Restore drill"
            echo '```'
            cat drill.txt
            echo '```'
            echo "Copy these numbers into the drill table in docs/deploy/restore-runbook.md."
          } >> "$GITHUB_STEP_SUMMARY"
