name: Seed staging demo data

# Fills one person's account on staging with demo businesses (decision T78). The person signs
# up on staging first, so their profile exists; passwords never pass through here. Started by
# hand from the Actions tab (or the API), never on a push.
on:
  workflow_dispatch:
    inputs:
      owner_email:
        description: "Email of the account (signed up on staging already)"
        required: true
      demo:
        description: "studio: one fitness studio; club: a padel club renting courts by the hour; pets: a pet grooming salon with owners and their pets; jobs: an air-conditioning company with on-site jobs at clients addresses; events: a photography studio with quotes, deposits and events; office: an accounting firm with retainers, time, bills and documents; owner: a pilates chain (5 branches) and a barbershop (3); networks: Urban Slice pizza (4 branches), Pulse Fitness gym (2) and Studio Bloom hair salon (3) for one owner, with the round 5 features (AI team, scheduled tasks, content studio, branch groups); categories: Adir fitness gym (formerly Iron & Flow) (strength, pilates and crossfit branches), Padel Nation (3 branches) and Glow Beauty salon; full: reduces the account to four businesses (Adir Fitness gym with five branches, Sharon Tennis Club with two, Blade Barbers with two, Merhav clinic with two), REMOVING other businesses the account alone owns, then adds logos and portraits; curated: reduces the account to three businesses (Adir fitness gym with strength, pilates and crossfit branches, Studio Bloom, Urban Slice), REMOVING other businesses the account alone owns, then adds logos and portraits; places: gives the demo branches their cities and a point on the map (adds only, deletes nothing; run it with replace off); profiles: adds logos, portraits and the crossfit branch to the account's existing demo businesses (adds only, deletes nothing; run it with replace off); platform: MyBiz console data (6 customer businesses, contact requests) for a platform owner; ownerclient: one fitness studio the account owns and also trains in as a client; asclient: makes the account a client of every business it already owns (adds only)"
        type: choice
        options: [owner, networks, categories, curated, full, places, profiles, studio, club, pets, jobs, events, office, platform, ownerclient, asclient]
        default: owner
      move_owner_from:
        description: "Instead of seeding: hand every business of this account to owner_email (both signed in once)"
        required: false
      delete_business_ids:
        description: "Instead of seeding: remove these businesses (ids, comma separated) that owner_email owns alone"
        required: false
      allow_co_owners:
        description: "With delete_business_ids: also remove businesses that have other owners (owner_email must be one of them)"
        type: boolean
        default: false
      delete_account:
        description: "Instead of seeding: remove this account if it holds no business or client record"
        required: false
      owner_name:
        description: "Display name for the account (optional)"
        required: false
      months:
        description: "Months of history"
        default: "3"
        type: choice
        options: ["1", "2", "3", "6"]
      replace:
        description: "Remove this account's earlier copies of the demo businesses first"
        type: boolean
        default: true

# Never at the same time as a migration.
concurrency:
  group: migrate-staging
  cancel-in-progress: false

jobs:
  seed:
    name: Seed demo businesses
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        working-directory: apps/api
        run: uv sync --locked --no-dev

      - name: Seed
        working-directory: apps/api
        env:
          API_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          API_ENVIRONMENT: staging
          OWNER_EMAIL: ${{ inputs.owner_email }}
          OWNER_NAME: ${{ inputs.owner_name }}
          MOVE_FROM: ${{ inputs.move_owner_from }}
          DELETE_IDS: ${{ inputs.delete_business_ids }}
          DELETE_ACCOUNT: ${{ inputs.delete_account }}
          ALLOW_CO_OWNERS: ${{ inputs.allow_co_owners }}
          DEMO: ${{ inputs.demo }}
          MONTHS: ${{ inputs.months }}
          REPLACE: ${{ inputs.replace }}
        run: |
          if [ -z "$API_DATABASE_URL" ]; then
            echo "::error::Secret STAGING_DATABASE_URL is not set (Settings > Environments > staging)."
            exit 1
          fi
          args=(--owner-email "$OWNER_EMAIL" --demo "$DEMO" --months "$MONTHS" --seed "$GITHUB_RUN_NUMBER")
          if [ -n "$OWNER_NAME" ]; then args+=(--owner-name "$OWNER_NAME"); fi
          if [ "$REPLACE" = "true" ]; then args+=(--replace); fi
          if [ -n "$MOVE_FROM" ]; then args+=(--move-owner-from "$MOVE_FROM"); fi
          if [ -n "$DELETE_IDS" ]; then
            IFS=',' read -ra ids <<< "$DELETE_IDS"
            for id in "${ids[@]}"; do args+=(--delete-business "$id"); done
          fi
          if [ "$ALLOW_CO_OWNERS" = "true" ]; then args+=(--allow-co-owners); fi
          if [ -n "$DELETE_ACCOUNT" ]; then args+=(--delete-account "$DELETE_ACCOUNT"); fi
          uv run python -m app.seed "${args[@]}"
