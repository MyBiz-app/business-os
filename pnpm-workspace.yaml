packages:
  - "apps/*"
  - "packages/*"

# Supply-chain safety: only install package versions published at least 1 day ago.
minimumReleaseAge: 1440

# Native packages ship prebuilt binaries; their install scripts are not needed.
allowBuilds:
  # Downloads the Sentry CLI binary, only needed to upload source maps (not used yet).
  "@sentry/cli": false
  "@parcel/watcher": false
  "@swc/core": false
  sharp: false
  # Storybook's dev server; the platform binary ships as its own package, the install script is only a check.
  esbuild: false
  # Downloads the Supabase CLI binary.
  supabase: true
  unrs-resolver: false

# Security: patched versions of transitive packages inside the Expo tooling (nightly `pnpm audit`).
overrides:
  uuid: ">=11.1.1"
  decode-uri-component: ">=0.5.0"
  zod: ">=4.6.6"
  "@sentry/cli>undici": ">=6.29.1 <7"

# No patched release exists yet for these two; both only run inside Expo's build tooling
# (@expo/cli dev server, @expo/config-plugins), never in the shipped apps or the API.
# Remove each line once a patched version is published.
auditConfig:
  ignoreGhsas:
    - GHSA-86w9-cpqp-85rv # node-forge <=1.4.0
    - GHSA-vfj7-8cjw-p6xm # braces <=3.0.3
